[project]
name = "tldr-podcast"
version = "0.1.0"
description = "Converts TLDR newsletters to a two-voice podcast MP3 using Gemini"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.1",
    "click>=8.3.1",
    "coloredlogs>=15.0.1",
    "google-genai>=1.0",
    "imapclient>=3.1.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "tenacity>=9.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
