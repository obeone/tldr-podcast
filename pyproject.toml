[project]
name = "tldr-podcast"
version = "1.7.1"
description = "Converts TLDR newsletters to a two-voice podcast MP3 using Gemini"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "beautifulsoup4>=4.14",
    "click>=8.3.3",
    "coloredlogs>=15.0.1",
    "google-genai>=2.2",
    "httpx>=0.28",
    "lxml>=6.1",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "questionary>=2.1",
    "rich>=15.0",
    "tenacity>=9.1",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
cloak = ["cloakbrowser>=0.1"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tldr-podcast = "tldr.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
