[project]
name = "tldr-podcast"
version = "1.4.1"
description = "Converts TLDR newsletters to a two-voice podcast MP3 using Gemini"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.1",
    "beautifulsoup4>=4.12",
    "click>=8.3.1",
    "coloredlogs>=15.0.1",
    "google-genai>=1.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "questionary>=2.0",
    "rich>=13.0",
    "tenacity>=9.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tldr-podcast = "tldr.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
