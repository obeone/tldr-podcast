name: Publish

# Triggered when pyproject.toml changes on main. The `detect` job reads the
# current project.version and releases it only when no matching v<version>
# git tag exists yet. This is independent of merge strategy (squash, rebase,
# multi-commit — the bump need not be in the tip commit) and idempotent:
# re-runs and dependency-only edits to an already-released version are no-ops.
# On an unreleased version: tests gate the release, the package is built and
# pushed to PyPI via Trusted Publishing (OIDC, no stored secret), then a
# v<version> GitHub release is cut.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already released (tag exists) — nothing to publish."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no release tag yet — release pipeline will run."
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run pytest tests/ -q

  publish:
    name: Build & publish to PyPI
    needs: [detect, test]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tldr-podcast
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    name: GitHub release
    needs: [detect, publish]
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the tag and release
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
