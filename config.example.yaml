# TLDR Newsletter to Podcast — Configuration Example
# Copy this file to config.yaml and fill in your values.
# Keys ending with _env reference the name of an environment variable
# that will be read at runtime (never store secrets directly here).

imap:
  host: imap.gmail.com
  port: 993
  username: your@email.com
  # Name of the environment variable holding your IMAP password
  password_env: IMAP_PASSWORD
  # IMAP folder to search for TLDR newsletters
  folder: INBOX
  # Folder where processed emails are moved after a successful podcast export.
  # The folder is created automatically if it does not exist.
  seen_folder: TLDR/Seen

gemini:
  # Name of the environment variable holding your Gemini API key
  api_key_env: GEMINI_API_KEY
  # Gemini model for dialogue generation (text / script writer)
  text_model: gemini-2.0-flash
  # Optional: cheaper model for pre-summarizing articles before dialogue
  # generation.  When set (and different from text_model), each article is
  # summarized first, reducing the token count sent to the script writer.
  # summary_model: gemini-2.0-flash-lite
  # Gemini model for TTS audio generation
  tts_model: gemini-2.5-flash-preview-tts
  # Optional: API service tier — "flex" (cheaper/slower) or "priority"
  # (faster/pricier).  Omit or leave empty for standard tier.
  # TTS does not support service tiers.
  # service_tier: flex
  # Language for the generated podcast dialogue and TTS preamble
  language: French
  speaker1:
    name: Alex
    voice: Puck
    personality: "enthusiastic, curious, quick to get excited about tech innovations"
  speaker2:
    name: Jordan
    voice: Charon
    personality: "analytical, mildly skeptical, adds nuance and historical context"
  dialogue:
    min_articles: 8      # minimum articles to cover (default: 8)
    max_articles: 12     # maximum articles to cover (default: 12)
    target_word_count: 1200  # minimum word count for the full dialogue
  tts_style:
    pace: "slow and deliberate"   # natural-language pace for TTS preamble
    scene: "Two friends co-hosting a casual French tech podcast in a cozy studio"
    temperature: 1.2   # 0.0–2.0 — higher = more expressive

scraping:
  # Maximum number of articles to scrape (additional ones keep email summary)
  max_articles: 15
  # HTTP request timeout in seconds
  timeout_seconds: 10

output:
  # Directory where the generated podcast file will be saved
  directory: output
  # Output format: mp3 or wav
  format: mp3

# Per-model pricing for token cost estimation (USD per 1 million tokens).
# Update these values to match current Gemini pricing at:
# https://ai.google.dev/pricing
#
# Flat format (applies regardless of service_tier):
#   model-name:
#     input_per_1m: 0.50
#     output_per_1m: 3.00
#
# Tier-aware format (selected by gemini.service_tier):
#   model-name:
#     standard:
#       input_per_1m: 0.50
#       output_per_1m: 3.00
#     flex:
#       input_per_1m: 0.25
#       output_per_1m: 1.50
pricing:
  gemini-2.0-flash:
    input_per_1m: 0.075
    output_per_1m: 0.30
  gemini-2.0-flash-lite:
    input_per_1m: 0.025
    output_per_1m: 0.10
  gemini-3-flash-preview:
    standard:
      input_per_1m: 0.50
      output_per_1m: 3.00
    flex:
      input_per_1m: 0.25
      output_per_1m: 1.50
  gemini-2.5-pro-preview-tts:
    input_per_1m: 1.00
    output_per_1m: 10.00
